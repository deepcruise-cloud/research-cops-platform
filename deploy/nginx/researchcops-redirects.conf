# Addresses from the previous researchcops.com website (PHP, /home/...) and its admin.
# Included by researchcops.conf and researchcops-http.conf; installed as
# /etc/nginx/snippets/researchcops-redirects.conf. Permanent, so search engines move their links.

location ~ ^/(index\.php|home/?)$                  { return 301 /; }
location ~ ^/home/services/?$                      { return 301 /solutions/; }
location ~ ^/home/services/1/?$                    { return 301 /solutions/end-to-end-project-management/; }
location ~ ^/home/services/2/?$                    { return 301 /solutions/survey-programming/; }
location ~ ^/home/services/3/?$                    { return 301 /solutions/translations/; }
location ~ ^/home/services/4/?$                    { return 301 /solutions/data-processing/; }
location ~ ^/home/services/5/?$                    { return 301 /solutions/insights-reporting/; }
location ~ ^/home/services/6/?$                    { return 301 /solutions/questionnaire-design/; }
location ~ ^/home/services/7/?$                    { return 301 /solutions/online-sampling/; }
location ~ ^/home/about/?$                         { return 301 /about/; }
location ~ ^/home/(contact|GetQuote)/?$            { return 301 /contact/; }
location ~ ^/home/(blog|blog_single)(/.*)?$        { return 301 /insights.html; }
location ~ ^/home/panel/?$                         { return 301 /who-we-serve/panel-sample-companies/; }
location ~ ^/home/privacy_policy/?$                { return 301 /policy.html?id=privacy; }
location ~ ^/home/term_conditions/?$               { return 301 /policy.html?id=terms; }
location ~ ^/home/                                 { return 301 /; }

# The old "Researchcops Admin" is retired; its login links open the website admin instead
location ~ ^/(auth|dashboard)(/.*)?$               { return 302 /admin.html; }
