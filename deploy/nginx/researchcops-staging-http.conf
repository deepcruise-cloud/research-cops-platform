# Phase 1 for staging: HTTP only, so certbot can verify the domain. Replaced by researchcops-staging.conf.
# HTTP: Let's Encrypt checks only
server {
    listen 80;
    listen [::]:80;
    server_name staging.researchcops.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

