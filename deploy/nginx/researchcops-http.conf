# Research COPS website, HTTP-only phase: serves the site over plain HTTP until the
# certificate is issued, then /etc/researchcops/golive.sh swaps in researchcops.conf (HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name researchcops.com www.researchcops.com;
    root /var/www/researchcops/current;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/researchcops.access.log;
    error_log  /var/log/nginx/researchcops.error.log warn;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
