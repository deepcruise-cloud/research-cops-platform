# Research COPS website: nginx site for the Utho server.
# Lives in its own file (/etc/nginx/sites-available/researchcops.conf) and only answers for
# researchcops.com / www.researchcops.com, so the ERP's server blocks are not touched.
# diy.researchcops.com is NOT handled here; keep its DNS record as it is.
#
# Before HTTPS is issued, use only the first server block (port 80) and run certbot (see deploy/README.md).

# HTTP: Let's Encrypt checks, then everything to https://www
server {
    listen 80;
    listen [::]:80;
    server_name researchcops.com www.researchcops.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.researchcops.com$request_uri; }
}

# Bare domain → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name researchcops.com;
    ssl_certificate     /etc/letsencrypt/live/researchcops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/researchcops.com/privkey.pem;
    return 301 https://www.researchcops.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.researchcops.com;

    ssl_certificate     /etc/letsencrypt/live/researchcops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/researchcops.com/privkey.pem;

    root /var/www/researchcops/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/researchcops.access.log;
    error_log  /var/log/nginx/researchcops.error.log warn;

    # Security headers (repeated in any location that sets its own add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Turn on once HTTPS has worked for a week:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Content admin → publish service (127.0.0.1 only)
    location = /api/publish {
        limit_except POST { deny all; }
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3061;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /api/ { return 404; }

    # Admin pages: never indexed, never cached
    location ~ ^/(admin|content-admin)\.html$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /build/site-content.json { expires -1; }

    # Old links (same redirects as vercel.json)
    location = /solution.html {
        if ($arg_id = management)   { return 301 /solutions/end-to-end-project-management/; }
        if ($arg_id = sampling)     { return 301 /solutions/online-sampling/; }
        if ($arg_id = development)  { return 301 /solutions/questionnaire-design/; }
        if ($arg_id = translations) { return 301 /solutions/translations/; }
        if ($arg_id = processing)   { return 301 /solutions/data-processing/; }
        if ($arg_id = consulting)   { return 301 /solutions/insights-reporting/; }
        if ($arg_id = automation)   { return 301 /solutions/workflow-automation/; }
        if ($arg_id = workflow-hub) { return 301 /solutions/workflow-automation/; }
        return 301 /solutions/online-sampling/;
    }
    location = /privacy  { return 301 /policy.html?id=privacy; }
    location = /terms    { return 301 /policy.html?id=terms; }
    location = /cookies  { return 301 /policy.html?id=cookies; }
    location = /insights { return 301 /insights.html; }

    # Caching: pages always fresh; styles and scripts briefly (file names do not change); images longer
    location ~* \.(?:css|js)$ { expires 1h; access_log off; }
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ { expires 30d; access_log off; }
    location ~* \.html$ { expires -1; }

    # Folders are pages: /about → /about/ (nginx adds the slash), /about/ → /about/index.html
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    # Nothing hidden is ever served
    location ~ /\. { deny all; }
}
